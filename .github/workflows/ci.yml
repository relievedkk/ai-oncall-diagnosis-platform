name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: oncall
          POSTGRES_USER: oncall
          POSTGRES_PASSWORD: oncall
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oncall -d oncall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://oncall:oncall@127.0.0.1:5432/oncall
      TEST_DATABASE_URL: postgresql+asyncpg://oncall:oncall@127.0.0.1:5432/oncall
      DATABASE_AUTO_CREATE: "false"
      AUTH_ENABLED: "false"
      # Tests stub provider calls; module imports still require a non-empty key.
      DASHSCOPE_API_KEY: "ci-test-only-not-a-real-key"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app tests --select E9,F63,F7,F82
      - run: uv run ruff check app/harness app/repositories/remediation.py app/services/remediation_service.py app/tasks/remediation.py app/api/remediation.py tests/test_remediation_*.py
      - run: uv run bandit -q -r app mcp_servers
      - run: uv run pip-audit --local --progress-spinner off
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: node --test tests/*.test.cjs
      - run: uv run alembic check
      - run: docker compose -f vector-database.yml config --quiet
      - run: docker compose -f monitoring.yml config --quiet
