services:
  prometheus:
    build:
      context: .
      dockerfile: monitoring/Dockerfile
    image: oncallagent-prometheus:local
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
    secrets:
      - api_key
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      - alertmanager
      - node-exporter
      - cadvisor

  alertmanager:
    build:
      context: .
      dockerfile: monitoring/Alertmanager.Dockerfile
    image: oncallagent-alertmanager:local
    container_name: alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
    secrets:
      - alertmanager_webhook_token
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

volumes:
  prometheus_data:
  alertmanager_data:

secrets:
  api_key:
    environment: API_KEY
  alertmanager_webhook_token:
    environment: ALERTMANAGER_WEBHOOK_TOKEN
