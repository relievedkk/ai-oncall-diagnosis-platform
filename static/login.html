<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>登录 · AI OnCall 智能运维平台</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/wght.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-sc@5.3.0/wght.css">
    <link rel="stylesheet" href="/static/login.css?v=20261010-2">
</head>
<body>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="login-form-pane">
                <div class="brand">
                    <div class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 40 40" fill="none">
                            <path d="M20 3.5 33 8.8v9.7c0 8.2-5.3 14.4-13 18-7.7-3.6-13-9.8-13-18V8.8L20 3.5Z" fill="currentColor" opacity=".16"/>
                            <path d="M20 5.5 31 10v8.5c0 6.9-4.3 12.3-11 15.7-6.7-3.4-11-8.8-11-15.7V10l11-4.5Z" stroke="currentColor" stroke-width="2"/>
                            <path d="M12.5 20h4l2.2-5.2 3.1 10.4 2.2-5.2h3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div>
                        <div class="brand-name">AI OnCall</div>
                        <div class="brand-subtitle">智能运维诊断平台</div>
                    </div>
                </div>

                <div class="login-heading">
                    <span class="eyebrow">OPERATOR CONSOLE</span>
                    <h1 id="loginTitle">欢迎回来</h1>
                    <p>登录后进入告警分析与故障诊断工作台</p>
                </div>

                <form id="loginForm" class="login-form" novalidate>
                    <label class="field-label" for="username">账号</label>
                    <div class="field-control">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/>
                        </svg>
                        <input id="username" name="username" type="text" autocomplete="username" maxlength="64" placeholder="请输入运维账号" required autofocus>
                    </div>

                    <label class="field-label" for="password">密码</label>
                    <div class="field-control">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="10" width="16" height="11" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>
                        </svg>
                        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="请输入密码" required>
                        <button id="togglePassword" class="password-toggle" type="button" aria-label="显示密码">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                                <circle cx="12" cy="12" r="2.5"/>
                            </svg>
                        </button>
                    </div>

                    <div class="form-options">
                        <label class="remember-option">
                            <input id="remember" type="checkbox">
                            <span>在这台设备保持登录 7 天</span>
                        </label>
                        <span class="secure-hint">受保护会话</span>
                    </div>

                    <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
                    <button id="loginButton" class="login-button" type="submit">
                        <span>登录工作台</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </button>
                </form>

                <p class="login-footnote">仅限授权运维人员使用 · 请妥善保管账号凭据</p>
            </div>

            <div class="login-visual-pane" aria-hidden="true">
                <div class="visual-grid"></div>
                <div class="visual-content">
                    <span class="visual-badge"><i></i> SYSTEM ONLINE</span>
                    <h2>让告警更清晰<br>让诊断有依据</h2>
                    <p>融合知识库、实时指标与日志证据，辅助 OnCall 人员快速定位故障。</p>
                    <div class="feature-list">
                        <div><strong>01</strong><span>告警自动触发诊断</span></div>
                        <div><strong>02</strong><span>证据链全程持久化</span></div>
                        <div><strong>03</strong><span>AI Agent 分步排障</span></div>
                    </div>
                </div>
                <div class="signal-orbit orbit-one"></div>
                <div class="signal-orbit orbit-two"></div>
                <div class="visual-block block-one"></div>
                <div class="visual-block block-two"></div>
                <div class="visual-block block-three"></div>
            </div>
        </section>
    </main>
    <script src="/static/login.js"></script>
</body>
</html>
