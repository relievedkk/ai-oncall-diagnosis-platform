x-diagnosis-environment: &diagnosis-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oncall}:${POSTGRES_PASSWORD:-oncall}@postgres:5432/${POSTGRES_DB:-oncall}
  DATABASE_AUTO_CREATE: "false"
  CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-oncall}:${RABBITMQ_DEFAULT_PASS:-oncall}@rabbitmq:5672//
  CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-diagnosis.default}
  CELERY_CRITICAL_QUEUE: ${CELERY_CRITICAL_QUEUE:-diagnosis.critical}
  CELERY_DEAD_LETTER_QUEUE: ${CELERY_DEAD_LETTER_QUEUE:-diagnosis.dead-letter}
  CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-5}
  DIAGNOSIS_LEASE_SECONDS: ${DIAGNOSIS_LEASE_SECONDS:-90}
  DIAGNOSIS_HEARTBEAT_SECONDS: ${DIAGNOSIS_HEARTBEAT_SECONDS:-30}
  OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1.0}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_API_BASE: ${DASHSCOPE_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-max}
  DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
  RAG_MODEL: ${RAG_MODEL:-qwen-max}
  MILVUS_HOST: standalone
  MILVUS_PORT: "19530"
  PROMETHEUS_BASE_URL: http://host.docker.internal:9090
  MCP_CLS_TRANSPORT: streamable-http
  MCP_CLS_URL: http://host.docker.internal:8003/mcp
  MCP_MONITOR_TRANSPORT: streamable-http
  MCP_MONITOR_URL: http://host.docker.internal:8004/mcp
  SERVICE_CATALOG_PATH: config/service_catalog.json
  TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
  TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
  PYTHONUTF8: "1"

services:
  postgres:
    container_name: oncall-postgres
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncall}
      POSTGRES_USER: ${POSTGRES_USER:-oncall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncall}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oncall_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    container_name: oncall-rabbitmq
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-oncall}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-oncall}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - oncall_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  diagnosis-migrate:
    image: ai-oncall-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: *diagnosis-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  queue-bootstrap:
    image: ai-oncall-worker:local
    command: ["uv", "run", "--no-sync", "python", "-m", "app.workers.queue_bootstrap"]
    environment: *diagnosis-environment
    depends_on:
      diagnosis-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: "no"

  diagnosis-critical-worker:
    container_name: oncall-diagnosis-critical-worker
    image: ai-oncall-worker:local
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --pool=solo
      - --hostname=critical@%h
      - --queues=diagnosis.critical
    environment: *diagnosis-environment
    depends_on:
      queue-bootstrap:
        condition: service_completed_successfully
      standalone:
        condition: service_healthy
    restart: unless-stopped

  diagnosis-default-worker:
    container_name: oncall-diagnosis-default-worker
    image: ai-oncall-worker:local
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --pool=solo
      - --hostname=default@%h
      - --queues=diagnosis.default
    environment: *diagnosis-environment
    depends_on:
      queue-bootstrap:
        condition: service_completed_successfully
      standalone:
        condition: service_healthy
    restart: unless-stopped

  outbox-publisher:
    container_name: oncall-outbox-publisher
    image: ai-oncall-worker:local
    command: ["uv", "run", "--no-sync", "python", "-m", "app.workers.outbox_publisher"]
    environment: *diagnosis-environment
    depends_on:
      queue-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"
      - "minio"
  # 这是新增的 Attu 服务哦！
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5
    ports:
      - "127.0.0.1:${ATTU_PORT:-8001}:3000" # 8000 常被本地应用占用，默认改用 8001
    environment:
      # MILVUS_URL 指向 Docker 网络里的 Milvus standalone 服务
      MILVUS_URL: standalone:19530
    depends_on:
      - standalone # 确保 Milvus 启动后再启动 Attu
networks:
  default:
    name: milvus

volumes:
  oncall_postgres_data:
  oncall_rabbitmq_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
